<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Cover Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ff6b5e'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='32' font-weight='bold' text-anchor='middle' fill='%230f2027'%3EVC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Vice City Cover Studio</h1>
  <p class="tagline">Your photo, Vice City poster style — fully offline.</p>
</header>
<main>
  <section class="controls" aria-label="Cover controls">
    <label class="field">
      <span>Photos</span>
      <input id="photoInput" type="file" accept="image/*" multiple>
    </label>

    <fieldset class="picker" id="layoutPicker">
      <legend>Layout</legend>
      <button type="button" data-layout="vice-grid" class="active">Vice Grid</button>
      <button type="button" data-layout="four-panel">Four Panel</button>
      <button type="button" data-layout="nine-grid">Nine Grid</button>
      <button type="button" data-layout="full-bleed">Full Bleed</button>
      <button type="button" data-layout="triple-strip">Triple Strip</button>
    </fieldset>

    <fieldset class="picker" id="gradePicker">
      <legend>Colour grade</legend>
      <button type="button" data-grade="vice-sunset" class="active">Vice City Sunset</button>
      <button type="button" data-grade="neon-nights">Neon Nights</button>
      <button type="button" data-grade="palm-dusk">Palm Dusk</button>
      <button type="button" data-grade="noir">Noir</button>
      <button type="button" data-grade="candy-pop">Candy Pop</button>
    </fieldset>

    <label class="field">
      <span>Title</span>
      <input id="titleInput" type="text" value="VICE CITY" maxlength="40" placeholder="VICE CITY">
    </label>
    <label class="field">
      <span>Subtitle</span>
      <input id="subtitleInput" type="text" value="Welcome back" maxlength="60" placeholder="Welcome back">
    </label>

    <label class="field">
      <span>Export size</span>
      <select id="sizeSelect">
        <option value="1080x1080" selected>1080 x 1080 (square)</option>
        <option value="1080x1350">1080 x 1350 (portrait)</option>
        <option value="1920x1080">1920 x 1080 (landscape)</option>
      </select>
    </label>

    <div class="actions">
      <button id="exportBtn" type="button" class="primary">Export PNG</button>
      <button id="shuffleBtn" type="button">Shuffle</button>
    </div>
  </section>

  <section class="preview" aria-label="Cover preview">
    <canvas id="coverCanvas" width="1080" height="1080"></canvas>
    <p class="hint">Pick photos, choose a layout and grade, then export your cover.</p>
  </section>
</main>
<script src="src/main.js"></script>
</body>
</html>
