<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Cover Studio — GTA 6-style cover art maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Vice City Cover Studio</h1>
  <p class="tagline">Turn your photo and a caption into GTA 6-style cover art. Offline, on your machine — your photos never leave it.</p>
</header>

<main class="studio">
  <section class="controls" aria-label="Cover controls">
    <div class="control-group">
      <label class="upload-label" for="photo-input">Add photos</label>
      <input id="photo-input" type="file" accept="image/*" multiple>
      <p class="hint" id="photo-count">No photos loaded yet.</p>
    </div>

    <div class="control-group">
      <span class="group-label" id="layout-label">Layout</span>
      <div class="picker" role="group" aria-labelledby="layout-label" id="layout-picker">
        <button type="button" data-layout="vice-grid" class="picker-btn active">Vice Grid</button>
        <button type="button" data-layout="four-panel" class="picker-btn">Four Panel</button>
        <button type="button" data-layout="nine-grid" class="picker-btn">Nine Grid</button>
        <button type="button" data-layout="full-bleed" class="picker-btn">Full Bleed</button>
        <button type="button" data-layout="triple-strip" class="picker-btn">Triple Strip</button>
      </div>
    </div>

    <div class="control-group">
      <span class="group-label" id="grade-label">Colour grade</span>
      <div class="picker" role="group" aria-labelledby="grade-label" id="grade-picker">
        <button type="button" data-grade="vice-sunset" class="picker-btn active">Vice Sunset</button>
        <button type="button" data-grade="neon-nights" class="picker-btn">Neon Nights</button>
        <button type="button" data-grade="palm-dusk" class="picker-btn">Palm Dusk</button>
        <button type="button" data-grade="noir" class="picker-btn">Noir</button>
        <button type="button" data-grade="candy-pop" class="picker-btn">Candy Pop</button>
      </div>
    </div>

    <div class="control-group">
      <span class="group-label" id="size-label">Export size</span>
      <div class="picker" role="group" aria-labelledby="size-label" id="size-picker">
        <button type="button" data-size="1080x1080" class="picker-btn active">1080 × 1080</button>
        <button type="button" data-size="1080x1350" class="picker-btn">1080 × 1350</button>
        <button type="button" data-size="1920x1080" class="picker-btn">1920 × 1080</button>
      </div>
    </div>

    <div class="control-group">
      <label class="field-label" for="title-input">Title</label>
      <input id="title-input" type="text" value="VICE CITY" maxlength="40" autocomplete="off">
      <label class="field-label" for="subtitle-input">Subtitle</label>
      <input id="subtitle-input" type="text" value="My story, my streets" maxlength="80" autocomplete="off">
    </div>

    <div class="control-group actions">
      <button type="button" id="shuffle-btn">Shuffle</button>
      <button type="button" id="export-btn">Export PNG</button>
    </div>

    <p class="status" id="status" role="status">Skeleton ready — the cover engine lands in the next build step.</p>
  </section>

  <section class="preview" aria-label="Cover preview">
    <canvas id="cover-canvas" width="1080" height="1080"></canvas>
    <div class="photo-strip" id="photo-strip" aria-label="Loaded photos"></div>
  </section>
</main>

<script type="module" src="src/main.js"></script>
</body>
</html>
